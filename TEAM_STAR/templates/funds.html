{% extends "base.html" %}

{% block content %}
<!-- 💰 Total Funds Card (Green glow hata diya, normal neon text lagaya) -->
<div class="glass-panel" style="padding: 30px; text-align: center; border-radius: 15px; margin-bottom: 40px; margin-top: 20px;">
    <h2 style="color: #a0a0a0; text-transform: uppercase; letter-spacing: 2px;">Squad Net Balance</h2>
    <h1 class="neon-text" style="font-size: 60px; margin-top: 10px;">₹{{ total_fund }}</h1>
    <p style="color: #00f3ff; margin-top: 10px; font-size: 18px;">
        Per Member Share: <span style="color: #fff; font-weight: bold;">₹{{ (total_fund / 4) | round(2) }}</span>
    </p>
</div>

<!-- 📜 History Button (Ispe click karne se history khulegi) -->
<div style="text-align: center; margin-bottom: 40px;">
    <a href="/history" class="glass-panel strategy-card" style="display: inline-block; padding: 15px 40px; text-decoration: none; width: auto; border: 1px solid #00f3ff;">
        <h3 style="margin: 0; font-size: 20px; color: #00f3ff;">View Match History Logs 📜</h3>
    </a>
</div>

<!-- 🛡️ Admin Panel -->
{% if session.get('is_admin') %}
<div class="glass-panel" style="padding: 20px; border-radius: 10px; margin-bottom: 30px; border-left: 4px solid #ff003c;">
    <h3 style="color: #ff003c; margin-bottom: 15px; font-family: 'Orbitron', sans-serif;">COMMAND CENTER: Add New Scrim Record</h3>
    
    <form action="/add_scrim" method="POST" style="display: flex; gap: 15px; flex-wrap: wrap; align-items: center;">
        <input type="date" name="date" required class="input-dark">
        <select name="time" class="input-dark">
            <option value="12:00 PM">12:00 PM</option>
            <option value="03:00 PM">03:00 PM</option>
            <option value="06:00 PM">06:00 PM</option>
            <option value="09:00 PM">09:00 PM</option>
        </select>
        <input type="number" name="entry_fee" placeholder="Entry Fee (e.g. 55)" required class="input-dark" style="width: 150px;">
        <input type="number" name="rank" placeholder="Position (1-12)" required class="input-dark" style="width: 120px;">
        <input type="number" name="profit" placeholder="Profit (If Win)" class="input-dark" style="width: 150px;">
        <button type="submit" class="btn-neon-red">Update Database</button>
    </form>
</div>
{% endif %}

{% endblock %}
